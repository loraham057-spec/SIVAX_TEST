# Secrets Manager → pod, par le pilote CSI Secrets Store et son fournisseur AWS.
#
# Rien ici ne contient une VALEUR secrète — uniquement des références. Le pilote
# les résout au montage avec le rôle IRSA du pod, et `secretObjects` les recopie
# dans un Secret Kubernetes pour que les conteneurs les consomment par `envFrom`
# plutôt qu'en lisant des fichiers.
#
# UNE SEULE CLASSE, là où la version Azure en portait trois. C'est la
# conséquence directe du modèle d'identité : le fournisseur Azure exigeait de
# nommer dans la classe le clientID de l'identité autorisée, si bien qu'une
# classe ne pouvait être montée que par les pods d'un seul ServiceAccount — d'où
# une classe par identité. Le fournisseur AWS, lui, prend simplement les
# identifiants du pod qui monte : la même classe sert `web`, `ai` et `jobs`, et
# chacun lit sous son propre rôle. Les trois rôles portent déjà la politique de
# lecture bornée au préfixe de l'environnement (module secrets).
#
# La rotation est activée sur le pilote (rotationPollInterval = 5m), donc une
# valeur changée dans Secrets Manager atteint les pods sans redéploiement. Les
# conteneurs qui mettent leur configuration en cache au démarrage ont quand même
# besoin d'un redémarrage pour la reprendre — c'est pourquoi l'application lit
# app_settings à la requête.
#
# ${secret_prefix} vaut diav1/<env> et ${aws_region} la region de
# l'environnement : Flux les substitue depuis Terraform au moment de la
# reconciliation, donc rien de propre a un environnement n'est ecrit ici et les
# overlays n'ont plus a reprendre cette liste.

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: diav1-secrets
  namespace: diav1
spec:
  provider: aws
  # Crée et tient à jour un Secret Kubernetes à côté du volume monté.
  secretObjects:
    - secretName: diav1-secrets
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
        - objectName: redis-url
          key: REDIS_URL
        - objectName: supabase-service-role-key
          key: SUPABASE_SERVICE_ROLE_KEY
        - objectName: app-settings-encryption-key
          key: APP_SETTINGS_ENCRYPTION_KEY
        - objectName: openai-api-key
          key: OPENAI_API_KEY
        - objectName: dhis2-password
          key: DHIS2_PASSWORD
        - objectName: push-internal-token
          key: PUSH_INTERNAL_TOKEN
        - objectName: resend-api-key
          key: RESEND_API_KEY
        - objectName: elevenlabs-api-key
          key: ELEVENLABS_API_KEY
        - objectName: vapid-private-key
          key: VAPID_PRIVATE_KEY
  parameters:
    region: "${aws_region}"
    # `objectAlias` est ce qui relie les deux moitiés de ce fichier : le nom
    # complet du secret côté AWS d'un côté, le nom court référencé par
    # `secretObjects` de l'autre. Sans alias, le fichier monté porterait le
    # chemin complet et `secretObjects` ne trouverait rien à recopier.
    objects: |
      - objectName: "${secret_prefix}/database-url"
        objectType: "secretsmanager"
        objectAlias: "database-url"
      - objectName: "${secret_prefix}/redis-url"
        objectType: "secretsmanager"
        objectAlias: "redis-url"
      - objectName: "${secret_prefix}/supabase-service-role-key"
        objectType: "secretsmanager"
        objectAlias: "supabase-service-role-key"
      - objectName: "${secret_prefix}/app-settings-encryption-key"
        objectType: "secretsmanager"
        objectAlias: "app-settings-encryption-key"
      - objectName: "${secret_prefix}/openai-api-key"
        objectType: "secretsmanager"
        objectAlias: "openai-api-key"
      - objectName: "${secret_prefix}/dhis2-password"
        objectType: "secretsmanager"
        objectAlias: "dhis2-password"
      - objectName: "${secret_prefix}/push-internal-token"
        objectType: "secretsmanager"
        objectAlias: "push-internal-token"
      - objectName: "${secret_prefix}/resend-api-key"
        objectType: "secretsmanager"
        objectAlias: "resend-api-key"
      - objectName: "${secret_prefix}/elevenlabs-api-key"
        objectType: "secretsmanager"
        objectAlias: "elevenlabs-api-key"
      - objectName: "${secret_prefix}/vapid-private-key"
        objectType: "secretsmanager"
        objectAlias: "vapid-private-key"
