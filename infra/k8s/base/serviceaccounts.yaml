# IRSA : chaque ServiceAccount est associé à un rôle IAM par le module Terraform
# (infra/aws/modules/identity). Un pod qui en porte un obtient des identifiants
# AWS temporaires sans qu'aucune clé ne soit montée — rien à faire tourner, rien
# à révoquer.
#
# Les NOMS ici sont porteurs : ils forment la condition `sub` de la politique de
# confiance du rôle (system:serviceaccount:diav1:<nom>). En renommer un sans
# mettre à jour `service_accounts` côté Terraform casse l'échange de jeton à
# l'exécution, pas au déploiement.
#
# Aucun label à ajouter côté pod, contrairement à Azure : le webhook intégré
# d'EKS injecte AWS_ROLE_ARN et le jeton projeté dès que l'annotation ci-dessous
# est présente sur le ServiceAccount du pod.
#
# Les ARN sont posés par environnement par les overlays.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: diav1
  annotations:
    eks.amazonaws.com/role-arn: "PATCHED_BY_OVERLAY"
  labels:
    app.kubernetes.io/part-of: diav1
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai
  namespace: diav1
  annotations:
    eks.amazonaws.com/role-arn: "PATCHED_BY_OVERLAY"
  labels:
    app.kubernetes.io/part-of: diav1
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jobs
  namespace: diav1
  annotations:
    eks.amazonaws.com/role-arn: "PATCHED_BY_OVERLAY"
  labels:
    app.kubernetes.io/part-of: diav1
automountServiceAccountToken: true
