# cert-manager — certificats TLS obtenus et renouvelés automatiquement.
#
# Composant de plateforme, comme le contrôleur d'ingress : même sur chaque
# cluster, réconcilié par la même boucle GitOps, jamais installé à la main.
#
# Pourquoi ici et pas au niveau Front Door : sur cet abonnement le quota de
# profils Front Door est à zéro, donc dev sert directement depuis l'IP publique
# de l'ingress. Sans terminaison TLS en amont, c'est nginx qui doit présenter un
# vrai certificat — sinon il sert son certificat autosigné de secours
# (« Kubernetes Ingress Controller Fake Certificate ») et tout navigateur
# affiche un avertissement.
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: cert-manager
      version: "v1.16.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    # Les CRD viennent avec la release : le ClusterIssuer voisin en dépend, et
    # les installer séparément obligerait à un ordre de bootstrap manuel.
    crds:
      enabled: true
      keep: true

    # Le cluster est petit : une réplique de chaque composant suffit.
    replicaCount: 1
    webhook:
      replicaCount: 1
    cainjector:
      replicaCount: 1

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 192Mi
