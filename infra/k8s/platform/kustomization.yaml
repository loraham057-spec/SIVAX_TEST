apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` transformer here, on purpose: unlike the application overlays,
# these objects declare their own namespaces (flux-system for the Helm sources,
# ingress-nginx for the release target) and must keep them.

resources:
  - ingress-nginx.yaml
  - cert-manager.yaml
  # Les ClusterIssuer ne sont PAS ici : voir platform-issuers/kustomization.yaml.
