# Construit une image, la scanne, et — seulement sur une branche déployable —
# la pousse et la signe. Extrait en template parce que la matrice ne survit pas
# à la traduction : un job de déploiement (celui qui porte l'approbation `prod`)
# ne peut pas déclarer `strategy: matrix`, donc app-build.yml émet un job par
# image et les deux formes partagent ces étapes.
#
# Différences avec la version Azure :
#   · `az acr login` devient `aws ecr get-login-password | docker login` ;
#   · le nom d'image n'est plus <registre>/diav1-web mais l'URL complète du
#     dépôt ECR — un dépôt par image, créé par Terraform — portée par le
#     variable group (ECR_REPO_WEB, ECR_REPO_AI) ;
#   · la signature Cosign s'appuie sur une clé KMS (awskms://) plutôt que sur
#     une clé Key Vault.

parameters:
  - name: name # web | ai
    type: string
  - name: repoVariable # ECR_REPO_WEB | ECR_REPO_AI
    type: string
  - name: context
    type: string
  - name: dockerfile
    type: string

steps:
  - script: |
      set -euo pipefail
      tag="sha-${BUILD_SOURCEVERSION:0:7}"
      echo "##vso[task.setvariable variable=imageTag]${tag}"
      echo "Image tag: ${tag}"
    displayName: Calculer le tag

  # Connecté même pour une pull request : le cache de build vit dans le
  # registre, et une PR veut le lire. L'écriture, elle, reste conditionnée à
  # PUBLISH plus bas.
  - script: |
      set -euo pipefail
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
        | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    displayName: Connexion au registre ECR
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: $(AWS_REGION)
      ECR_REGISTRY: $(ECR_REGISTRY)

  - script: |
      set -euo pipefail
      image="${REPO}:$(imageTag)"

      docker buildx create --name diav1 --driver docker-container --use 2>/dev/null \
        || docker buildx use diav1

      args=(
        --file "${{ parameters.dockerfile }}"
        --tag "$image"
        # Chargée dans le démon local pour que Trivy scanne EXACTEMENT l'image
        # qui serait poussée — scanner après le push est trop tard.
        --load
        # Le cache vit dans le dépôt lui-même, sous un tag dédié : ECR n'a pas
        # de dépôt implicite « cache/… » comme ACR, et en créer un second
        # n'apporterait rien. image-manifest=true est obligatoire — sans lui,
        # ECR refuse le manifeste de cache que produit buildkit.
        --cache-from "type=registry,ref=${REPO}:buildcache"
        --build-arg "NEXT_PUBLIC_SUPABASE_URL=$(SUPABASE_URL)"
        --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(SUPABASE_ANON_KEY)"
        --build-arg "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$(VAPID_PUBLIC_KEY)"
        --build-arg "BUILD_ID=$(imageTag)"
      )
      if [ "${PUBLISH,,}" = "true" ]; then
        args+=( --cache-to "type=registry,ref=${REPO}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" )
      fi

      docker buildx build "${args[@]}" "${{ parameters.context }}"
    displayName: "Build — ${{ parameters.name }}"
    env:
      PUBLISH: $(publish)
      REPO: $(${{ parameters.repoVariable }})
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: $(AWS_REGION)

  - script: |
      set -euo pipefail
      # Version tenue en un seul endroit : le tag et le nom de l'archive la
      # portent tous les deux, et les deux avaient divergé — v0.58.1 n'existe
      # plus en amont, le téléchargement tombait en 404 et le scan échouait
      # comme si l'image était vulnérable.
      TRIVY_VERSION=0.74.0
      curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
        | sudo tar -xz -C /usr/local/bin trivy
      trivy image \
        --format table \
        --exit-code 1 \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        "${REPO}:$(imageTag)"
    displayName: "Scan Trivy — ${{ parameters.name }}"
    env:
      REPO: $(${{ parameters.repoVariable }})

  - script: |
      set -euo pipefail
      image="${REPO}:$(imageTag)"
      latest="${REPO}:latest"

      docker push "$image"

      # On amorce aussi :latest. Les overlays sortent d'usine avec
      # newTag: latest, donc la toute première réconciliation GitOps — avant
      # qu'un déploiement n'ait bougé le tag — a une image à tirer. Même
      # empreinte, donc la signature ci-dessous la couvre aussi.
      docker tag  "$image" "$latest"
      docker push "$latest"
    displayName: "Push — ${{ parameters.name }}"
    condition: and(succeeded(), eq(variables['publish'], 'true'))
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: $(AWS_REGION)
      REPO: $(${{ parameters.repoVariable }})

  # Signature. La signature sans clé de GitHub dépend de Fulcio, qui fait
  # confiance à l'émetteur OIDC de GitHub Actions ; il n'existe pas d'émetteur
  # Azure DevOps, donc la signature se fait avec une clé asymétrique KMS. Le
  # principal qui signe a besoin de kms:Sign et kms:GetPublicKey sur la clé.
  #
  # Renseigner COSIGN_KEY_ARN dans le variable group l'active ; laissée vide,
  # l'étape est sautée plutôt que de faire échouer le build.
  - script: |
      set -euo pipefail
      curl -fsSL -o /tmp/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
      sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign

      cosign sign --yes \
        --key "awskms:///${COSIGN_KEY_ARN}" \
        "${REPO}:$(imageTag)"
    displayName: "Signature Cosign — ${{ parameters.name }}"
    condition: >-
      and(succeeded(),
          eq(variables['publish'], 'true'),
          ne(variables['COSIGN_KEY_ARN'], ''))
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: $(AWS_REGION)
      COSIGN_KEY_ARN: $(COSIGN_KEY_ARN)
      REPO: $(${{ parameters.repoVariable }})
